<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Comando Naval</title>
<style>
/* Layout concept: a ship's log laid open on a chart table — fixed HUD "quartel-general" bar on top,
   a single bound-logbook column below, each scene a dossier card with a campaign-colored spine. */
:root{
  --bg:#0a1420;
  --surface:#122033;
  --surface-2:#1a2d45;
  --line:#28415c;
  --ink:#eee6d3;
  --ink-dim:#9fb2c6;
  --brass:#cda345;
  --brass-dim:#8d7128;
  --ok:#5a9b72;
  --warn:#cda345;
  --bad:#b65845;
  --font-display:'Playfair Display',Georgia,serif;
  --font-body:'Source Serif 4',Georgia,serif;
  --font-ui:'Inter','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  margin:0;
  padding-inline:16px;
  min-height:100%;
}
html,body{height:100%}
body{
  background-image:
    radial-gradient(ellipse at top, rgba(205,163,69,0.07), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0}
::selection{background:var(--brass); color:#1a1200}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:14px;
  padding:12px 14px; margin:0 -16px 18px;
  background:rgba(10,20,32,0.92); backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.hud .brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.hud .brand svg{flex:none}
.hud .brand .names{min-width:0}
.hud .brand .names .t1{font-family:var(--font-ui); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--brass); white-space:nowrap}
.hud .brand .names .t2{font-family:var(--font-display); font-size:17px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hud .scores{display:flex; gap:10px; font-family:var(--font-ui)}
.hud .score{text-align:right; min-width:0}
.hud .score .v{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
.hud .score .k{font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); white-space:nowrap}
@media (max-width:520px){
  .hud .brand .t1{display:none}
  .hud .score .k{display:none}
  .hud .scores{gap:14px}
}

main{max-width:720px; margin:0 auto; padding-bottom:48px}

/* ---------- Menu ---------- */
.intro{padding:6px 2px 22px}
.intro .eyebrow{font-family:var(--font-ui); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--brass); margin-bottom:10px}
.intro h1{font-size:clamp(26px,6vw,38px); margin-bottom:10px}
.intro p{color:var(--ink-dim); font-size:15.5px; line-height:1.6; max-width:60ch}

/* ---------- Timeline visual ---------- */
.timeline-wrap{margin-bottom:22px}
.timeline-wrap .ttl{font-family:var(--font-ui); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:10px}
.timeline{display:flex; gap:0; overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch; scrollbar-width:thin}
.timeline::-webkit-scrollbar{height:5px}
.timeline::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
.timeline-item{flex:0 0 auto; width:112px; text-align:center; cursor:pointer; padding:0 4px; position:relative; background:none; border:none; font-family:inherit; color:inherit}
.timeline-item .tl-line{position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0}
.timeline-item:first-child .tl-line{display:none}
.timeline-item .tl-icon{position:relative; z-index:1; width:26px; height:26px; margin:0 auto 6px; border-radius:50%; background:var(--surface); border:1.5px solid var(--c); display:flex; align-items:center; justify-content:center; color:var(--c); transition:background .12s ease}
.timeline-item:hover .tl-icon{background:var(--c); color:#0a1420}
.timeline-item .tl-yr{font-family:var(--font-ui); font-size:9px; color:var(--ink-dim); white-space:nowrap; letter-spacing:.02em}
.timeline-item .tl-nm{font-family:var(--font-ui); font-size:10.5px; color:var(--ink); margin-top:2px; line-height:1.25; min-height:26px}
.timeline-item:hover .tl-nm{color:var(--c)}

.campaigns{display:grid; gap:14px; grid-template-columns:1fr}
@media (min-width:640px){ .campaigns{grid-template-columns:1fr 1fr} }
.campaign-card{
  --c: var(--brass);
  position:relative; text-align:left;
  background:linear-gradient(180deg, var(--surface), var(--surface-2));
  border:1px solid var(--line); border-left:4px solid var(--c);
  border-radius:8px; padding:0 16px 14px;
  font-family:inherit; color:inherit;
  display:flex; flex-direction:column; gap:8px;
  transition:border-color .15s ease;
  overflow:hidden;
}
.campaign-card:hover{ border-color:var(--c) }
.card-banner{
  margin:0 -16px 6px; height:66px;
  background:linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, var(--surface)), var(--surface));
  display:flex; align-items:flex-end; overflow:hidden;
}
.card-banner svg{width:100%; height:100%; display:block}
.campaign-card .era{margin-top:12px}
.campaign-card .era{font-family:var(--font-ui); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--c)}
.campaign-card h3{font-size:19px}
.campaign-card .desc{color:var(--ink-dim); font-size:13.5px; line-height:1.5}
.campaign-card .flags{font-size:16px}
.campaign-card .meta{display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-family:var(--font-ui); font-size:11px; color:var(--ink-dim)}
.campaign-card .meta .quizbest{color:var(--c)}
.campaign-card .bar{height:4px; border-radius:2px; background:var(--line); overflow:hidden; margin-top:2px}
.campaign-card .bar i{display:block; height:100%; background:var(--c)}
.card-actions{display:flex; gap:8px; margin-top:10px}
.card-actions button{
  flex:1; font-family:var(--font-ui); font-weight:700; font-size:12.5px; cursor:pointer;
  border-radius:7px; padding:9px 10px; transition:border-color .12s ease, background .12s ease;
}
.card-actions .btn-campaign{background:var(--c); color:#0a1420; border:none}
.card-actions .btn-campaign:hover{filter:brightness(1.1)}
.card-actions .btn-quiz{background:none; border:1px solid var(--line); color:var(--ink-dim)}
.card-actions .btn-quiz:hover{color:var(--ink); border-color:var(--c)}

/* ---------- Quiz (Treino Rápido) ---------- */
.quiz-card{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--camp-color, var(--brass));
  border-radius:10px; padding:22px 20px; margin-bottom:16px; text-align:center;
}
.quiz-card .kind{font-family:var(--font-ui); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--camp-color, var(--brass)); margin-bottom:10px}
.quiz-card h2{font-size:clamp(19px,4.2vw,23px); line-height:1.4; max-width:46ch; margin:0 auto}
.quiz-options{display:flex; flex-direction:column; gap:10px}
.qopt{
  display:flex; gap:12px; align-items:center; width:100%; text-align:left;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:13px 14px; font-family:var(--font-ui); font-size:14.5px; color:var(--ink); cursor:pointer;
}
.qopt:hover:not(:disabled){border-color:var(--camp-color, var(--brass))}
.qopt:disabled{cursor:default}
.qopt .dot{flex:none; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ink-dim)}
.qopt.right{outline:1px solid var(--ok)}
.qopt.right .dot{background:var(--ok); border-color:var(--ok)}
.qopt.wrong{outline:1px solid var(--bad)}
.qopt.wrong .dot{background:var(--bad); border-color:var(--bad)}
.qopt.faded{opacity:.45}
.quiz-note{
  font-family:var(--font-ui); font-size:13px; color:var(--ink-dim); background:var(--surface-2);
  border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-top:4px;
}
.quiz-note b{color:var(--ink)}
.streak-row{display:flex; justify-content:center; gap:22px; margin-top:14px; font-family:var(--font-ui); font-size:12px; color:var(--ink-dim)}
.streak-row b{color:var(--ink); font-variant-numeric:tabular-nums}

/* ---------- Scene ---------- */
.progress-row{display:flex; align-items:center; gap:10px; margin:4px 0 16px; font-family:var(--font-ui)}
.progress-row button.back{background:none; border:1px solid var(--line); color:var(--ink-dim); border-radius:6px; padding:5px 10px; font-family:var(--font-ui); font-size:12px; cursor:pointer}
.progress-row button.back:hover{color:var(--ink); border-color:var(--ink-dim)}
.progress-row .track{flex:1; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden}
.progress-row .track i{display:block; height:100%; background:var(--camp-color, var(--brass))}
.progress-row .count{font-size:11.5px; color:var(--ink-dim); white-space:nowrap}

.scene-card{
  background:var(--surface); border:1px solid var(--line);
  border-left:5px solid var(--camp-color, var(--brass));
  border-radius:10px; padding:18px 18px 20px; margin-bottom:16px;
}
.scene-meta{display:flex; flex-wrap:wrap; gap:8px 18px; font-family:var(--font-ui); margin-bottom:14px}
.scene-meta .m{display:flex; flex-direction:column; gap:2px; min-width:0}
.scene-meta .m .k{display:inline-flex; align-items:center; gap:4px; font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:var(--camp-color, var(--brass))}
.scene-meta .m .v{font-size:13px; color:var(--ink)}
.scene-meta .flags{font-size:20px; letter-spacing:2px}
.ico{display:inline-block; vertical-align:-2px; flex:none}
.chip .ico{margin-right:3px; vertical-align:-2.5px}
.feedback .badge .ico{vertical-align:-2.5px; margin-right:1px}
.qopt .kind-ico{flex:none; color:var(--ink-dim)}
.scene-card h2{font-size:clamp(20px,4.5vw,25px); margin-bottom:12px}
.chiplist{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:var(--font-ui); font-size:11.5px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); padding:3px 8px; border-radius:20px; white-space:nowrap}
.narrative p{font-size:15.5px; line-height:1.68; margin:0 0 12px; max-width:66ch}
.narrative p:last-child{margin-bottom:0}

.choices{display:flex; flex-direction:column; gap:10px; margin-top:4px}
.choice-btn{
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:13px 14px; font-family:inherit; color:var(--ink); cursor:pointer;
  font-size:14.5px; line-height:1.5; transition:border-color .12s ease, background .12s ease;
}
.choice-btn:hover:not(:disabled){border-color:var(--camp-color, var(--brass))}
.choice-btn:disabled{cursor:default}
.choice-btn .letter{
  flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--bg); border:1px solid var(--line); color:var(--ink-dim);
  font-family:var(--font-ui); font-weight:700; font-size:12.5px;
}
.choice-btn.chosen .letter{border-color:currentColor}
.choice-btn.chosen.ok{outline:1px solid var(--ok)}
.choice-btn.chosen.ok .letter{background:var(--ok); color:#06160c; border-color:var(--ok)}
.choice-btn.chosen.bad{outline:1px solid var(--bad)}
.choice-btn.chosen.bad .letter{background:var(--bad); color:#1d0905; border-color:var(--bad)}
.choice-btn.chosen.warn{outline:1px solid var(--warn)}
.choice-btn.chosen.warn .letter{background:var(--warn); color:#1a1200; border-color:var(--warn)}
.choice-btn.faded{opacity:.45}

.feedback{
  margin-top:16px; padding:14px 16px; border-radius:8px; font-family:var(--font-ui);
  background:var(--surface-2); border:1px solid var(--line); border-left:4px solid var(--badge-color, var(--brass));
}
.feedback .badge{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--badge-color, var(--brass)); margin-bottom:8px}
.feedback p{font-family:var(--font-body); font-size:14.5px; line-height:1.6; margin:0 0 10px; color:var(--ink)}
.feedback .delta{display:flex; gap:16px; font-size:12px; color:var(--ink-dim)}
.feedback .delta b{color:var(--ink); font-variant-numeric:tabular-nums}

.continue-row{display:flex; justify-content:flex-end; margin-top:16px}
.btn-main{
  font-family:var(--font-ui); font-weight:700; font-size:13.5px; letter-spacing:.02em;
  background:var(--brass); color:#1a1200; border:none; border-radius:7px;
  padding:11px 20px; cursor:pointer;
}
.btn-main:hover{background:#e0b956}
.btn-ghost{
  font-family:var(--font-ui); font-weight:600; font-size:13px;
  background:none; color:var(--ink-dim); border:1px solid var(--line); border-radius:7px;
  padding:10px 16px; cursor:pointer;
}
.btn-ghost:hover{color:var(--ink); border-color:var(--ink-dim)}

/* ---------- Summary ---------- */
.summary-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:24px 20px; text-align:center}
.summary-card .flags{font-size:28px; margin-bottom:10px}
.summary-card h2{font-size:24px; margin-bottom:6px}
.summary-card .sub{color:var(--ink-dim); font-size:14px; margin-bottom:22px}
.summary-stats{display:flex; justify-content:center; gap:28px; margin-bottom:22px; flex-wrap:wrap}
.summary-stats .s{min-width:110px}
.summary-stats .s .big{font-family:var(--font-display); font-size:34px; color:var(--camp-color, var(--brass)); font-variant-numeric:tabular-nums}
.summary-stats .s .lbl{font-family:var(--font-ui); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-dim)}
.summary-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.recap{text-align:left; margin-top:22px; display:flex; flex-direction:column; gap:6px}
.recap .r{display:flex; gap:8px; align-items:baseline; font-family:var(--font-ui); font-size:12.5px; padding:6px 0; border-top:1px solid var(--line)}
.recap .r .ic{flex:none; width:16px; text-align:center}
.recap .r .tt{color:var(--ink-dim); flex:1}
.recap .r .tt-sub{color:var(--ok); font-weight:600}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;600;700&display=swap">

<header class="hud">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle cx="24" cy="24" r="21" stroke="#cda345" stroke-width="1.6"/>
      <path d="M24 6 L27 21 L24 24 L21 21 Z" fill="#cda345"/>
      <path d="M24 42 L21 27 L24 24 L27 27 Z" fill="#5a6c82"/>
      <path d="M6 24 L21 21 L24 24 L21 27 Z" fill="#5a6c82"/>
      <path d="M42 24 L27 27 L24 24 L27 21 Z" fill="#5a6c82"/>
      <circle cx="24" cy="24" r="2.4" fill="#eee6d3"/>
    </svg>
    <div class="names">
      <div class="t1">Comando Naval</div>
      <div class="t2" id="hud-title">Sala de Guerra</div>
    </div>

  <div class="scores">
    <div class="score"><div class="v" id="hud-precisao">—</div><div class="k">Precisão Histórica</div></div>

  </div>
</header>

<main id="app"></main>

<script>
/* =========================================================
   DADOS — baseados em battles_data.py (fonte já validada
   contra os livros, resumos e linha do tempo do usuário)
   ========================================================= */
const CAMPAIGNS = [
{
  id:'antiguidade', color:'#a66a3c', flags:'🏛️⚓',
  title:'Guerras Navais da Antiguidade', subtitle:'Das trirremes gregas às galés romanas — o nascimento da guerra no mar',
  faixa:'525 a.C. – 476 d.C.',
  scenes:[
    {
      date:'490 – 479 a.C.', location:'Maratona e Estreito de Salamina, Grécia',
      flags:['🇬🇷','🏹'], ships:['Trirremes gregas (remo e vela)'], commanders:['Temístocles (Atenas)', 'Xerxes I (Pérsia)'],
      title:'Salamina: a Primeira Grande Batalha Naval da História',
      narrative:[
        `Depois de duas tentativas persas frustradas de conquistar a Grécia — a primeira destruída por uma tempestade, a segunda detida em terra pelos atenienses em Maratona (490 a.C.) — o rei Xerxes I volta dez anos depois com um exército e uma frota descomunais, varrendo o norte da Grécia e vencendo os espartanos nas Termópilas. Atenas é evacuada; a cidade cai nas mãos persas.`,
        `É no mar que o general ateniense Temístocles decide a guerra. Ele atrai a enorme frota persa — fenícia, egípcia e jônia — para o estreito apertado de Salamina, perto de Atenas, onde o número não ajuda os persas: os navios maiores e mais lentos não conseguem manobrar no espaço reduzido, e as trirremes gregas, mais ágeis, destroem a frota invasora.`
      ],
      choices:[
        {letter:'A', type:'historica', label:'Temístocles atrai a frota persa para o estreito de Salamina, onde a vantagem numérica persa perde valor.',
          feedback:'No ano seguinte, em Micale (479 a.C.), os gregos destroem os restos da frota persa encalhada — selando de vez o fim das invasões persas à Grécia.'},
        {letter:'B', type:'tatica', label:'Temístocles enfrenta a frota persa em mar aberto, onde a Grécia poderia usar sua velocidade para cercar os flancos inimigos.',
          feedback:'Em mar aberto, a vantagem numérica esmagadora da Pérsia teria prevalecido — é justamente o espaço apertado de Salamina que anula essa vantagem e favorece as trirremes gregas.'},
        {letter:'C', type:'diplomatica', label:'Temístocles negocia a rendição de Atenas em troca de autonomia local, evitando a batalha.',
          feedback:'Atenas já estava evacuada e a cidade ocupada; a guerra só termina com a frota persa destruída no mar — essa negociação não ocorreu.'}
      ]
    },
    {
      date:'429 – 405 a.C.', location:'Golfo de Corinto, Siracusa (Sicília) e Helesponto',
      flags:['🇬🇷'], ships:['Trirremes'], commanders:['Formião (Atenas)', 'Lisandro (Esparta)'],
      title:'Atenas Aposta Demais no Mar',
      narrative:[
        `A rivalidade entre Atenas (potência naval) e Esparta (potência terrestre) explode na Guerra do Peloponeso. No Golfo de Corinto, o almirante ateniense Formião vence duas vezes a frota espartano-coríntia, mostrando a superioridade técnica das trirremes atenienses. Envaidecida, Atenas aposta numa expedição ambiciosa: invadir a distante Siracusa, na Sicília.`,
        `A aposta fracassa: cercada no porto de Siracusa, a frota ateniense é destruída num desastre que marca o início do fim para Atenas. Anos depois, em Egos-Pótamos, no Helesponto, o espartano Lisandro surpreende e aniquila o que restou da frota ateniense, decidindo a guerra.`
      ],
      choices:[
        {letter:'A', type:'historica', label:'Atenas vence no Golfo de Corinto, mas se desgasta numa expedição distante a Siracusa, que termina em desastre naval.',
          feedback:'A Expedição à Sicília (415-413 a.C.) é apontada por historiadores como o erro estratégico decisivo de Atenas — o prelúdio da derrota final em Egos-Pótamos.'},
        {letter:'B', type:'tatica', label:'Atenas concentra toda sua frota na defesa do território ático, recusando-se a enviar forças para a Sicília.',
          feedback:'Historicamente Atenas enviou uma grande expedição à Sicília — decisão que, vista em retrospecto, mais contribuiu para sua derrota final do que qualquer ataque espartano direto.'},
        {letter:'C', type:'diplomatica', label:'Atenas negocia uma paz duradoura com Esparta logo após as vitórias de Formião, evitando novos riscos.',
          feedback:'Não foi o que ocorreu — Atenas manteve a guerra e ainda ampliou a aposta com a Expedição à Sicília, que terminou em catástrofe.'}
      ]
    },
    {
      date:'334 – 326 a.C.', location:'Tiro, Fenícia (atual Líbano)',
      flags:['⚔️'], ships:['Frota fenícia e cipriota (incorporada ao cerco)'], commanders:['Alexandre, o Grande (Macedônia)'],
      title:'O Cerco Naval de Tiro',

  scroll:`<svg class="ico" viewBox="0 0 24 24" width="{s}" height="{s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a2 2 0 012 2v1a2 2 0 01-2 2H8"/><path d="M6 4a2 2 0 00-2 2v12a2 2 0 002 2h11a2 2 0 002-2v-1"/><path d="M6 20a2 2 0 01-2-2V6"/><path d="M8 9h7M8 13h7"/></svg>`,
  gear:`<svg class="ico" viewBox="0 0 24 24" width="{s}" height="{s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3v2.4M12 18.6V21M4.2 12H6.6M17.4 12h2.4M6.3 6.3l1.7 1.7M16 16l1.7 1.7M17.7 6.3L16 8M8 16l-1.7 1.7"/></svg>`,
  compass:`<svg class="ico" viewBox="0 0 24 24" width="{s}" height="{s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M15 9l-2 6-4 2 2-6z" fill="currentColor" stroke="none"/></svg>`
};
function icon(name, size){ const s = size||14; const svg = ICONS[name]; return svg ? svg.replace(/\{s\}/g,s) : ''; }

/* =========================================================
   ILUSTRAÇÕES DE CAMPANHA — silhuetas náuticas simples que
   acompanham a tecnologia da era (remo, vela latina, caravela,
   navio de linha, encouraçado, dreadnought, contratorpedeiro,
   fragata moderna) + emblema doutrinário para o módulo conceitual.
   ========================================================= */
const SILHOUETTE_BY_ID = {
  'antiguidade':'trireme', 'expansao-arabe':'medieval', 'grandes-navegacoes':'caravela',
  'brasil-holandes':'caravela', 'colonia-napoleonica':'galeao', 'independencia':'transicao',
  'paraguai':'ironclad', 'guerra1':'dreadnought', 'guerra2':'destroyer',
  'emprego-permanente':'doctrine', 'pos-guerra-fria':'modern'
};
function campaignBanner(campId){
  const kind = SILHOUETTE_BY_ID[campId] || 'caravela';
  if(kind === 'doctrine'){
    return `<svg viewBox="0 0 280 66" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <g transform="translate(140,33)" fill="none" stroke="var(--c)" stroke-width="2" opacity="0.85">
        <circle r="22" stroke-opacity="0.55"/>
        <circle cx="0" cy="-9" r="2.6" fill="var(--c)" stroke="none"/>
        <path d="M0 -4v17"/>
        <path d="M-9 4a9 9 0 0018 0"/>
        <path d="M-15 4h6M9 4h6"/>
        <path d="M-30 0h10M20 0h10" stroke-opacity="0.4"/>
      </g>
    </svg>`;
  }
  const wave = `<path d="M0,58 Q23,52 46,58 T92,58 T138,58 T184,58 T230,58 T280,58 L280,66 L0,66 Z" fill="var(--c)" opacity="0.14"/>`;
  const hullPath = `M58,42 Q58,34 70,34 L196,34 Q208,34 208,42 L199,54 Q190,59 177,59 L89,59 Q76,59 67,54 Z`;
  const hull = `<path d="${hullPath}" fill="var(--c)" opacity="0.55"/>`;
  let details = '';
  const mast = (x,h) => `<line x1="${x}" y1="34" x2="${x}" y2="${34-h}" stroke="var(--c)" stroke-width="2" opacity="0.8"/>`;
  const squareSail = (x,y,w,h) => `<rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="var(--c)" opacity="0.28" stroke="var(--c)" stroke-width="1.2"/>`;
  const lateenSail = (x,y,w,h) => `<path d="M${x},${y} L${x+w},${y+h} L${x},${y+h} Z" fill="var(--c)" opacity="0.3" stroke="var(--c)" stroke-width="1.2"/>`;
  const funnel = (x,h) => `<rect x="${x-4}" y="${34-h}" width="8" height="${h}" rx="1.5" fill="var(--c)" opacity="0.6"/>`;
  const turret = (x) => `<rect x="${x-7}" y="26" width="14" height="9" rx="1.5" fill="var(--c)" opacity="0.65"/>`;
  const oars = () => Array.from({length:6}).map((_,i)=>`<line x1="${78+i*20}" y1="58" x2="${68+i*20}" y2="64" stroke="var(--c)" stroke-width="1.6" opacity="0.5"/>`).join('');
  switch(kind){
    case 'trireme':
      details = mast(133,26) + squareSail(133,12,30,18) + oars();
      break;
    case 'medieval':
      details = mast(133,28) + lateenSail(133,10,26,20);
      break;
    case 'caravela':
      details = mast(115,30) + mast(155,22) + lateenSail(115,8,22,20) + squareSail(155,14,20,14);
      break;
    case 'galeao':
      details = mast(100,32) + mast(133,36) + mast(166,30) + squareSail(100,10,20,16) + squareSail(133,4,24,20) + squareSail(166,12,18,16);
      break;
    case 'transicao':
      details = mast(110,30) + mast(156,30) + squareSail(110,10,20,16) + squareSail(156,10,20,16) + funnel(133,20);
      break;
    case 'ironclad':
      details = funnel(133,22) + turret(100) + turret(168);
      break;
    case 'dreadnought':
      details = funnel(118,26) + funnel(150,26) + turret(90) + turret(178) + mast(133,30);
      break;
    case 'destroyer':
      details = funnel(125,22) + funnel(148,18) + mast(100,26);
      break;
    case 'modern':
      details = `<line x1="133" y1="34" x2="133" y2="6" stroke="var(--c)" stroke-width="2" opacity="0.8"/><circle cx="133" cy="6" r="3.2" fill="none" stroke="var(--c)" stroke-width="1.6" opacity="0.8"/>` + turret(110);
      break;
  }
  return `<svg viewBox="0 0 280 66" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${wave}${hull}${details}</svg>`;
}

/* =========================================================
   PONTUAÇÃO POR TIPO DE ESCOLHA
   ========================================================= */
const POINTS = {
  historica:  {precisao:10, tatico:10},
  tatica:     {precisao:3,  tatico:1},
  tecnologica:{precisao:2,  tatico:2},
  diplomatica:{precisao:5,  tatico:4}
};
const BADGE = {
  historica:  {label:'Rota histórica', cls:'ok',  color:'var(--ok)', icon:'anchor'},
  tatica:     {label:'Desvio tático',  cls:'bad', color:'var(--bad)', icon:'swords'},
  tecnologica:{label:'Uso incorreto de tecnologia/doutrina', cls:'bad', color:'var(--bad)', icon:'gear'},
  diplomatica:{label:'Via diplomática alternativa', cls:'warn', color:'var(--warn)', icon:'scroll'}
};

/* =========================================================
   ESTADO
   ========================================================= */
const SAVE_KEY = 'comando-naval-v1';
let state = {
  screen:'menu', campaignIdx:null, sceneIdx:0, chosenLetter:null,
  campaignProgress:{}, // id -> {precisao, tatico, count, recap:[{title,letter,type}], quizBest}
  // quiz ("Treino Rápido") state
  quizCampId:null, quizOrder:[], quizIdx:0, quizChosen:null,
  quizScore:{correct:0, total:0}, quizMissed:[]
};

function emptyProgress(){ return {precisao:0, tatico:0, count:0, recap:[], quizBest:null}; }
function getProgress(campId){
  if(!state.campaignProgress[campId]) state.campaignProgress[campId] = emptyProgress();
  else if(state.campaignProgress[campId].quizBest===undefined) state.campaignProgress[campId].quizBest = null;
  return state.campaignProgress[campId];
}

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.campaignProgress) state.campaignProgress = parsed.campaignProgress; }
  }catch(e){}
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({campaignProgress:state.campaignProgress})); }catch(e){}
}

function totals(){
  let precisao=0, tatico=0, count=0;
  Object.values(state.campaignProgress).forEach(p=>{ precisao+=p.precisao; tatico+=p.tatico; count+=p.count; });
  return {precisao, tatico, count};
}
function pct(sum,count){ return count>0 ? Math.round((sum/(count*10))*100) : null; }

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById('app');

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function updateHUD(){
  const t = totals();
  document.getElementById('hud-precisao').textContent = t.count ? pct(t.precisao,t.count)+'%' : '—';
  document.getElementById('hud-tatico').textContent = t.count ? pct(t.tatico,t.count)+'%' : '—';
  const titleEl = document.getElementById('hud-title');
  if(state.screen==='menu') titleEl.textContent='Sala de Guerra';
  else if(state.screen==='quiz' || state.screen==='quizSummary'){
    const c = CAMPAIGNS.find(c=>c.id===state.quizCampId);
    titleEl.textContent = 'Treino Rápido · ' + (c ? c.title : '');
  }
  else if(state.campaignIdx!=null) titleEl.textContent = CAMPAIGNS[state.campaignIdx].title;
}

function render(){
  updateHUD();
  if(state.screen==='menu') renderMenu();
  else if(state.screen==='scene') renderScene();
  else if(state.screen==='summary') renderSummary();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='quizSummary') renderQuizSummary();
  window.scrollTo(0,0);
}

function renderMenu(){
  const cards = CAMPAIGNS.map((c,i)=>{
    const p = getProgress(c.id);
    const done = p.count>0;
    const percent = done ? pct(p.precisao,p.count) : 0;
    const barPct = Math.round((p.count/c.scenes.length)*100);
    const hasQuiz = QUICK_QUESTIONS[c.id] && QUICK_QUESTIONS[c.id].length;
    const quizLabel = p.quizBest!=null ? ` · treino: ${p.quizBest}%` : '';
    return `<div class="campaign-card" style="--c:${c.color}">
      <div class="card-banner">${campaignBanner(c.id)}</div>
      <div class="era">${esc(c.faixa)}</div>
      <div class="flags">${c.flags}</div>
      <h3>${esc(c.title)}</h3>
      <div class="desc">${esc(c.subtitle)}</div>
      <div class="bar"><i style="width:${barPct}%"></i></div>
      <div class="meta">
        <span>${p.count}/${c.scenes.length} decisões tomadas${done ? ' · '+percent+'% precisão' : ''}<span class="quizbest">${quizLabel}</span></span>
      </div>
      <div class="card-actions">
        <button class="btn-campaign" data-camp="${i}">${p.count>0 ? (p.count>=c.scenes.length?'Rever »':'Continuar »') : 'Campanha »'}</button>
        ${hasQuiz ? `<button class="btn-quiz" data-quiz="${c.id}">Treino rápido »</button>` : ''}
      </div>
    </div>`;
  }).join('');

  const timelineItems = CAMPAIGNS.map((c,i)=>`<button class="timeline-item" style="--c:${c.color}" data-camp="${i}" title="${esc(c.title)}">
      <div class="tl-line"></div>
      <div class="tl-icon">${icon(SILHOUETTE_BY_ID[c.id]==='doctrine' ? 'compass' : 'ship', 13)}</div>
      <div class="tl-yr">${esc(c.faixa)}</div>
      <div class="tl-nm">${esc(c.title)}</div>
    </button>`).join('');

  app.innerHTML = `
    <div class="intro">
      <div class="eyebrow">Jogo de decisões · História Naval</div>
      <h1>Assuma o comando.</h1>
      <p>Cada campanha reconstrói uma guerra real da Marinha do Brasil, cena a cena: onde aconteceu, quando, quem comandou, que navios entraram em ação — e a decisão exata que os comandantes tiveram pela frente. Escolha a rota histórica ou um desvio plausível, e veja o que realmente mudaria. Ou teste sua memória direto, no Treino Rápido: nomes de navios, comandantes e locais.</p>
    </div>
    <div class="timeline-wrap">
      <div class="ttl">Linha do tempo · 525 a.C. – 1989</div>
      <div class="timeline">${timelineItems}</div>
    </div>
    <div class="campaigns">${cards}</div>
  `;
  app.querySelectorAll('[data-camp]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.camp);
      const p = getProgress(CAMPAIGNS[idx].id);
      enterScene(idx, Math.min(p.count, CAMPAIGNS[idx].scenes.length-1));
      state.campaignIdx = idx;
      state.screen = (p.count>=CAMPAIGNS[idx].scenes.length) ? 'summary' : 'scene';
      render();
    });
  });
  app.querySelectorAll('[data-quiz]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      startQuiz(btn.dataset.quiz);
      render();
    });
  });
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Reassigns letters A/B/C/D in random order each time a scene is entered,
// so the historically-correct option isn't predictably always "A".
function buildShuffledChoices(scene){
  const letters = ['A','B','C','D'];
  return shuffleArray(scene.choices).map((c,i)=>({...c, letter:letters[i]}));
}
function enterScene(campIdx, sceneIdx){
  state.campaignIdx = campIdx;
  state.sceneIdx = sceneIdx;
  state.chosenLetter = null;
  state.shuffledChoices = buildShuffledChoices(CAMPAIGNS[campIdx].scenes[sceneIdx]);
}

/* =========================================================
   TREINO RÁPIDO (QUIZ) — perguntas curtas e diretas sobre
   navios, comandantes e locais. Mesma lógica anti-vício do
   modo narrativo: ordem das perguntas e das opções é
   embaralhada de novo a cada tentativa.
   ========================================================= */
function buildQuizOrder(campId){
  const pool = QUICK_QUESTIONS[campId] || [];
  return shuffleArray(pool).map(q=>({
    q: q.q, note: q.note, correct: q.correct,
    options: shuffleArray(q.options)
  }));
}
function startQuiz(campId){
  state.quizCampId = campId;
  state.quizOrder = buildQuizOrder(campId);
  state.quizIdx = 0;
  state.quizChosen = null;
  state.quizScore = {correct:0, total:0};
  state.quizMissed = [];
  state.screen = 'quiz';
}

function renderQuiz(){
  const camp = CAMPAIGNS.find(c=>c.id===state.quizCampId);
  const total = state.quizOrder.length;
  const item = state.quizOrder[state.quizIdx];
  const chosen = state.quizChosen;

  const optionsHtml = item.options.map(opt=>{
    let cls='qopt';
    if(chosen){
      if(opt===item.correct) cls += ' right';
      else if(opt===chosen) cls += ' wrong';
      else cls += ' faded';
    }
    return `<button class="${cls}" data-opt="${esc(opt)}" ${chosen?'disabled':''}>
      <span class="dot"></span><span>${esc(opt)}</span>
    </button>`;
  }).join('');

  const noteHtml = chosen ? `<div class="quiz-note">${chosen===item.correct ? '<b>Correto.</b> ' : `<b>Resposta certa:</b> ${esc(item.correct)}. `}${esc(item.note)}</div>
    <div class="continue-row">
      <button class="btn-main" id="btn-quiz-next">${state.quizIdx+1<total ? 'Próxima pergunta' : 'Ver resultado'} »</button>
    </div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <button class="back" id="btn-menu">« Campanhas</button>
      <div class="track"><i style="width:${Math.round(state.quizIdx/total*100)}%; --camp-color:${camp.color}"></i></div>
      <div class="count">Pergunta ${state.quizIdx+1} / ${total}</div>
    </div>
    <div class="quiz-card" style="--camp-color:${camp.color}">
      <div class="kind">${esc(camp.flags)} Treino rápido · ${esc(camp.title)}</div>
      <h2>${esc(item.q)}</h2>
    </div>
    <div class="quiz-options">${optionsHtml}</div>
    ${noteHtml}
  `;

  document.getElementById('btn-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });

  if(!chosen){
    app.querySelectorAll('.qopt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const opt = btn.dataset.opt;
        state.quizChosen = opt;
        state.quizScore.total += 1;
        if(opt===item.correct) state.quizScore.correct += 1;
        else state.quizMissed.push({q:item.q, correct:item.correct, chosen:opt});
        render();
      });
    });
  } else {
    const nextBtn = document.getElementById('btn-quiz-next');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      if(state.quizIdx+1 < total){ state.quizIdx += 1; state.quizChosen = null; render(); }
      else {
        const p = getProgress(camp.id);
        const scorePct = pct(state.quizScore.correct*10, state.quizScore.total);
        if(p.quizBest==null || scorePct>p.quizBest) p.quizBest = scorePct;
        persist();
        state.screen='quizSummary';
        render();
      }
    });
  }
}

function renderQuizSummary(){
  const camp = CAMPAIGNS.find(c=>c.id===state.quizCampId);
  const scorePct = pct(state.quizScore.correct*10, state.quizScore.total);
  const missedHtml = state.quizMissed.map(m=>`<div class="r"><span class="ic" style="color:var(--bad)">✕</span><span class="tt">${esc(m.q)}<span class="tt-sub"> · certa: ${esc(m.correct)}</span></span></div>`).join('');

  app.innerHTML = `
    <div class="progress-row">
      <button class="back" id="btn-menu">« Campanhas</button>
      <div class="track"><i style="width:100%; --camp-color:${camp.color}"></i></div>
      <div class="count">Treino concluído</div>
    </div>
    <div class="summary-card" style="--camp-color:${camp.color}">
      <div class="flags">${camp.flags}</div>
      <h2>Treino rápido · ${esc(camp.title)}</h2>
      <div class="sub">${state.quizScore.correct}/${state.quizScore.total} respostas certas</div>
      <div class="summary-stats">
        <div class="s"><div class="big">${scorePct}%</div><div class="lbl">Acerto</div></div>
      </div>
      <div class="summary-actions">
        <button class="btn-main" id="btn-quiz-replay">Refazer treino</button>
        <button class="btn-ghost" id="btn-back-menu">Ver todas as campanhas</button>
      </div>
      ${missedHtml ? `<div class="recap">${missedHtml}</div>` : ''}
    </div>
  `;
  document.getElementById('btn-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });
  document.getElementById('btn-back-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });
  document.getElementById('btn-quiz-replay').addEventListener('click', ()=>{
    startQuiz(camp.id);
    render();
  });
}

function renderScene(){
  const camp = CAMPAIGNS[state.campaignIdx];
  const scene = camp.scenes[state.sceneIdx];
  const total = camp.scenes.length;
  const choices = state.shuffledChoices;

  const metaBlocks = [];
  metaBlocks.push(`<div class="m"><span class="k">${icon('calendar',12)}Época</span><span class="v">${esc(scene.date)}</span></div>`);
  metaBlocks.push(`<div class="m"><span class="k">${icon('pin',12)}Local</span><span class="v">${esc(scene.location)}</span></div>`);
  metaBlocks.push(`<div class="m"><span class="k">${icon('anchor',12)}Forças</span><span class="v flags">${scene.flags.join(' ')}</span></div>`);

  const chips = (label, arr, ic) => arr && arr.length ? `<div class="m" style="flex:1 1 100%"><span class="k">${icon(ic,12)}${label}</span><div class="chiplist">${arr.map(x=>`<span class="chip">${icon(ic,11)}${esc(x)}</span>`).join('')}</div></div>` : '';

  const narrativeHtml = scene.narrative.map(p=>`<p>${esc(p)}</p>`).join('');

  const choicesHtml = choices.map(c=>{
    let cls='choice-btn';
    if(state.chosenLetter){
      if(c.letter===state.chosenLetter){
        const tone = c.type==='historica' ? 'ok' : (c.type==='diplomatica' ? 'warn' : 'bad');
        cls += ' chosen ' + tone;
      }
      else cls += ' faded';
    }
    return `<button class="${cls}" data-letter="${c.letter}" ${state.chosenLetter?'disabled':''}>
      <span class="letter">${c.letter}</span>
      <span>${esc(c.label)}</span>
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if(state.chosenLetter){
    const chosen = choices.find(c=>c.letter===state.chosenLetter);
    const badge = BADGE[chosen.type];
    const pts = POINTS[chosen.type];
    feedbackHtml = `<div class="feedback" style="--badge-color:${badge.color}">
      <div class="badge">${icon(badge.icon,13)}${badge.label}</div>
      <p>${esc(chosen.feedback)}</p>
      <div class="delta"><span>Precisão histórica <b>+${pts.precisao}</b></span><span>Tático &amp; tecnológico <b>+${pts.tatico}</b></span></div>
    </div>
    <div class="continue-row">
      <button class="btn-main" id="btn-continue">${state.sceneIdx+1<total ? 'Próxima decisão' : 'Ver relatório da campanha'} »</button>
    </div>`;
  }

  app.innerHTML = `
    <div class="progress-row">
      <button class="back" id="btn-menu">« Campanhas</button>
      <div class="track"><i style="width:${Math.round((state.sceneIdx)/total*100)}%; --camp-color:${camp.color}"></i></div>
      <div class="count">Cena ${state.sceneIdx+1} / ${total}</div>
    </div>
    <div class="scene-card" style="--camp-color:${camp.color}">
      <div class="scene-meta">${metaBlocks.join('')}${chips('Navios / tecnologia em destaque', scene.ships, 'ship')}${chips('Comandantes em campo', scene.commanders, 'medal')}</div>
      <h2>${esc(scene.title)}</h2>
      <div class="narrative">${narrativeHtml}</div>
    </div>
    <div class="choices">${choicesHtml}</div>
    ${feedbackHtml}
  `;

  document.getElementById('btn-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });

  if(!state.chosenLetter){
    app.querySelectorAll('.choice-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const letter = btn.dataset.letter;
        const choice = choices.find(c=>c.letter===letter);
        const correctLetter = choices.find(c=>c.type==='historica').letter;
        const pts = POINTS[choice.type];
        const p = getProgress(camp.id);
        p.precisao += pts.precisao; p.tatico += pts.tatico; p.count += 1;
        p.recap.push({title:scene.title, letter, type:choice.type, correctLetter});
        state.chosenLetter = letter;
        persist();
        render();
      });
    });
  } else {
    const contBtn = document.getElementById('btn-continue');
    if(contBtn) contBtn.addEventListener('click', ()=>{
      if(state.sceneIdx+1 < total){ enterScene(state.campaignIdx, state.sceneIdx+1); state.screen='scene'; }
      else { state.screen='summary'; }
      render();
    });
  }
}

function renderSummary(){
  const camp = CAMPAIGNS[state.campaignIdx];
  const p = getProgress(camp.id);
  const precisaoPct = pct(p.precisao, p.count);
  const taticoPct = pct(p.tatico, p.count);
  const iconFor = t => t==='historica' ? '✓' : (t==='diplomatica' ? '◇' : '✕');

  const recap = p.recap.map(r=>{
    const wrong = r.type!=='historica';
    const sub = wrong && r.correctLetter ? `<span class="tt-sub"> · certa: ${esc(r.correctLetter)}</span>` : '';
    return `<div class="r"><span class="ic" style="color:${BADGE[r.type].color}">${iconFor(r.type)}</span><span class="tt">${esc(r.title)}${sub}</span><span>${esc(r.letter)}</span></div>`;
  }).join('');

  app.innerHTML = `
    <div class="progress-row">
      <button class="back" id="btn-menu">« Campanhas</button>
      <div class="track"><i style="width:100%; --camp-color:${camp.color}"></i></div>
      <div class="count">Campanha concluída</div>
    </div>
    <div class="summary-card" style="--camp-color:${camp.color}">
      <div class="flags">${camp.flags}</div>
      <h2>${esc(camp.title)}</h2>
      <div class="sub">${p.count} decisões tomadas</div>
      <div class="summary-stats">
        <div class="s"><div class="big">${precisaoPct}%</div><div class="lbl">Precisão histórica</div></div>
        <div class="s"><div class="big">${taticoPct}%</div><div class="lbl">Tático &amp; tecnológico</div></div>
      </div>
      <div class="summary-actions">
        <button class="btn-main" id="btn-replay">Refazer campanha</button>
        <button class="btn-ghost" id="btn-back-menu">Ver todas as campanhas</button>
      </div>
      <div class="recap">${recap}</div>
    </div>
  `;
  document.getElementById('btn-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });
  document.getElementById('btn-back-menu').addEventListener('click', ()=>{ state.screen='menu'; render(); });
  document.getElementById('btn-replay').addEventListener('click', ()=>{
    state.campaignProgress[camp.id] = emptyProgress();
    persist();
    enterScene(state.campaignIdx, 0);
    state.screen='scene';
    render();
  });
}

/* =========================================================
   BOOT
   ========================================================= */
function start(savedHotData){
  loadSave();
  render();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(() => ({}));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data || {});
} else {
  start({});
}
</script>
